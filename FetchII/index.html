<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch parte II</title>
</head>
<body>
    <h1>Fetch parte II</h1>

    <div>
        <h2>Agregar Nuevo Platillo</h2>
        <label for="inputNombrePlatillo">Nombre:</label><br>
        <input type="text" id="inputNombrePlatillo" placeholder="Ej. Pizza Pepperoni"><br><br>

        <label for="inputPrecioPlatillo">Precio:</label><br>
        <input type="number" id="inputPrecioPlatillo" placeholder="Ej. 120.50"><br><br>

        <label for="inputImagenPlatillo">URL de la Imagen:</label><br>
        <input type="text" id="inputImagenPlatillo" placeholder="Ej. https://ejemplo.com/imagen.jpg"><br><br>

        <button id="btnAgregarPlatillo">Agregar platillo</button>
    </div>

    <hr> <button id="btnEliminarPlatillo">Eliminar platillo (ID 3)</button>

    <hr> <div>
        <h2>Platillo del día (décimo)</h2>
        <h2 id="platillo">Cargando...</h2>
        <img id="imagenPlatillo" alt="Imagen del platillo" style="max-width: 300px; height: auto;">
    </div>

    <script src="script.js"></script>
</body>
</html>
